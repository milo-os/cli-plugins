        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/milo-os/search/releases/download/v0.8.6/milo-search_Linux_x86_64.tar.gz
      sha256: "cf359d3d43f43de9da84cff8f6951e4307bcbbf0815233e4c576ce033bac411f"
    - selector:
        matchLabels:
          os: linux
          arch: arm64
