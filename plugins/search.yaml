# Search CLI plugin (milo-search) — find any resource across the platform.
# Versions/checksums point at the milo-os/search GitHub release assets.
apiVersion: datumctl.datum.net/v1alpha1
kind: Plugin
metadata:
  name: search
spec:
  shortDescription: Search for resources across the platform by kind, name, and project scope
  homepage: https://github.com/milo-os/search
  version: v0.8.6
  platforms:
