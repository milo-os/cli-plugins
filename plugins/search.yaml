      sha256: "9e8a36c98af25cd1a1325d586b23cf3884322d8f9c34b3c0a3d906feb941ab76"
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/milo-os/search/releases/download/v0.8.1/milo-search_Windows_arm64.zip
      sha256: "3fb8035cc52f74a1d47b94858cef94ff8453788b0c01ea470dddb2e2fa88e2a9"
