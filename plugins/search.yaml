# Search CLI plugin (milo-search) — find any resource across the platform.
# Versions/checksums point at the milo-os/search GitHub release assets.
apiVersion: datumctl.datum.net/v1alpha1
kind: Plugin
metadata:
  name: search
spec:
  shortDescription: Search for resources across the platform by kind, name, and project scope
  homepage: https://github.com/milo-os/search
  version: v0.8.1
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/milo-os/search/releases/download/v0.8.1/milo-search_Linux_x86_64.tar.gz
      sha256: "cc5444bae7ccb5d531c20313d437fa3d9cc6178784f4610450f377cbf08fe88b"
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/milo-os/search/releases/download/v0.8.1/milo-search_Linux_arm64.tar.gz
      sha256: "75025b686bacfd00f28d4ca92acf00455cf7c4cd03d3f660bca0bef41e74c8d2"
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/milo-os/search/releases/download/v0.8.1/milo-search_Darwin_x86_64.tar.gz
      sha256: "4b73f82004f9f124d9603ff12f9080fec9546c2502eb4c40fe8f039cc50678c8"
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/milo-os/search/releases/download/v0.8.1/milo-search_Darwin_arm64.tar.gz
      sha256: "25e34548990f7d84ff44b78e3cb578c7586606843f3672a73e9e2cc8a04f98ad"
    - selector:
        matchLabels:
          os: windows
          arch: amd64
