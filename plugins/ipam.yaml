        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/milo-os/ipam/releases/download/v0.5.3/milo-ipam_Linux_x86_64.tar.gz
      sha256: "464ff33e36732762329d26f47cef4b91b910221fb9f8942007d10aa8e0921528"
