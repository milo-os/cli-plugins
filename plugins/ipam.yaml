# IPAM CLI plugin (milo-ipam) — manage IP address space across the platform.
# Versions/checksums point at the milo-os/ipam GitHub release assets.
apiVersion: datumctl.datum.net/v1alpha1
kind: Plugin
metadata:
  name: ipam
spec:
  shortDescription: Manage IP address space (pools and prefixes) across the platform
  homepage: https://github.com/milo-os/ipam
  version: v0.3.0
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/milo-os/ipam/releases/download/v0.3.0/milo-ipam_Linux_x86_64.tar.gz
      sha256: "58bbff9047f7b5b3c048eed03fbc891e782494836b028e8184b87030e4791f44"
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/milo-os/ipam/releases/download/v0.3.0/milo-ipam_Linux_arm64.tar.gz
      sha256: "f8eaeb19094ac16c77f0f02099a1b1c9bedeaca82126e8f214b190ec49ce67dc"
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/milo-os/ipam/releases/download/v0.3.0/milo-ipam_Darwin_x86_64.tar.gz
      sha256: "88c7b6c25448176e80f53ae7f3534c816da1997258c7680602176245e265b0d7"
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
