        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/milo-os/ipam/releases/download/v0.4.1/milo-ipam_Linux_x86_64.tar.gz
      sha256: "d65ecfd580e7fc47b71aa373c21091206e1dbc31b45193af31dd5a22f546eb66"
    - selector:
        matchLabels:
          os: linux
          arch: arm64
