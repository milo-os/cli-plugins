      sha256: "a6e08fa8e5dc1656419cf56ba4e072390d909ee1ca04392cd0a996173a87fb55"
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/milo-os/ipam/releases/download/v0.3.0/milo-ipam_Windows_arm64.zip
      sha256: "e248255aca41765334ec0883cb838dad31d5a496879c4e9042863a2550e42e5f"
