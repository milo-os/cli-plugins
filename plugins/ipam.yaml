# IPAM CLI plugin (milo-ipam) — manage IP address space across the platform.
# Versions/checksums point at the milo-os/ipam GitHub release assets.
apiVersion: datumctl.datum.net/v1alpha1
kind: Plugin
metadata:
  name: ipam
spec:
  shortDescription: Manage IP address space (pools and prefixes) across the platform
  homepage: https://github.com/milo-os/ipam
  version: v0.3.1
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/milo-os/ipam/releases/download/v0.3.1/milo-ipam_Linux_x86_64.tar.gz
      sha256: "d4000e6d82f3406d20e01d1c2feae972c3878ff56ebf10b00bbb5bbaa02898f2"
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/milo-os/ipam/releases/download/v0.3.1/milo-ipam_Linux_arm64.tar.gz
      sha256: "ce8e0d93648a93eb8caf2510ca8ba6158a158b0fb4f51f10a8b9fed9325726a0"
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/milo-os/ipam/releases/download/v0.3.1/milo-ipam_Darwin_x86_64.tar.gz
      sha256: "06dab9f12cf22074e7a3c3b3ff0374adf0907f8792ab0c6c5e58a9307d4aac51"
