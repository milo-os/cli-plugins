# IPAM CLI plugin (milo-ipam) — manage IP address space across the platform.
# Versions/checksums point at the milo-os/ipam GitHub release assets.
apiVersion: datumctl.datum.net/v1alpha1
kind: Plugin
metadata:
  name: ipam
spec:
  shortDescription: Manage IP address space (pools and prefixes) across the platform
  homepage: https://github.com/milo-os/ipam
  version: v0.5.4
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/milo-os/ipam/releases/download/v0.5.4/milo-ipam_Linux_x86_64.tar.gz
      sha256: "b13f139831a6372d1dd3c238eda8d026abc32f343ab2d8737971691daf5b510d"
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/milo-os/ipam/releases/download/v0.5.4/milo-ipam_Linux_arm64.tar.gz
      sha256: "51983c33df0ef77953be36cf12dd3508559fe61cd242c3d569bd70a407f1dd6d"
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
