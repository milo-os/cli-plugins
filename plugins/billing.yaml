# Billing CLI plugin (milo-billing): `datumctl billing usage` shows metered
# usage and spend from UsageQuery. Versions/checksums point at the
# milo-os/billing GitHub release assets.
apiVersion: datumctl.datum.net/v1alpha1
kind: Plugin
metadata:
  name: billing
spec:
  shortDescription: View metered usage and spend for your organization or project
  homepage: https://github.com/milo-os/billing
  version: v0.5.6
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/milo-os/billing/releases/download/v0.5.6/milo-billing_Linux_x86_64.tar.gz
      sha256: ccf83f8bb29d4b307e30daaeb0f730181e496ba04f655676d57bc8b749f30238
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/milo-os/billing/releases/download/v0.5.6/milo-billing_Linux_arm64.tar.gz
      sha256: a2387dcfc841e0ab8846bcf09a140b2e9b18e4ce2b0d3ecc4b132a4f973c4659
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/milo-os/billing/releases/download/v0.5.6/milo-billing_Darwin_x86_64.tar.gz
      sha256: ee203a6becd2c401db7083e4c59354a3f1e1301c3b787f0c85b7a9dd0ab0e543
    - selector:
