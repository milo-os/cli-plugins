      sha256: 510dc5fa8f7164f5ffddff40dd9d7d010ba90786c0afaebea5e2e38bebb6e59c
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/milo-os/billing/releases/download/v0.11.1/milo-billing_Windows_arm64.zip
