      sha256: 777bd5338d53b68ad4ce6ae80af36819d45fa01e632d00da077a663a94c749fc
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/milo-os/billing/releases/download/v0.10.0/milo-billing_Windows_arm64.zip
      sha256: a1c860498ee37ec32aebc40c1345aa9e0711597f8791cd7ddea176c2902d9171
