# Billing CLI plugin (milo-billing): `datumctl billing usage` shows metered
# usage and spend from UsageQuery. Versions/checksums point at the
# milo-os/billing GitHub release assets.
apiVersion: datumctl.datum.net/v1alpha1
kind: Plugin
metadata:
  name: billing
spec:
  shortDescription: View metered usage and spend for your organization or project
  homepage: https://github.com/milo-os/billing
  version: v0.11.1
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/milo-os/billing/releases/download/v0.11.1/milo-billing_Linux_x86_64.tar.gz
      sha256: bbe7ec8be09d67131023d0c1697ce758d25b388ec1f70edbebbc82b9426f8dcf
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/milo-os/billing/releases/download/v0.11.1/milo-billing_Linux_arm64.tar.gz
      sha256: aa9b074343897aae4cb2ba6fba4fee743d983231b6ac1e48d0fdd6f09355c22f
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/milo-os/billing/releases/download/v0.11.1/milo-billing_Darwin_x86_64.tar.gz
      sha256: 78be7924027b84cd5490f795afa01b342b5a2d02d38b35409d5dc22bb03981bf
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
