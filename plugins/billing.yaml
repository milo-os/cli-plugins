        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/milo-os/billing/releases/download/v0.8.4/milo-billing_Linux_x86_64.tar.gz
      sha256: 8a74e8b526cccfddcc9485eb57f98ebe623615665a757ef5d8a57354415fcc28
    - selector:
        matchLabels:
          os: linux
          arch: arm64
