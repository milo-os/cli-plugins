# Billing CLI plugin (milo-billing): `datumctl billing usage` shows metered
# usage and spend from UsageQuery. Versions/checksums point at the
# milo-os/billing GitHub release assets.
apiVersion: datumctl.datum.net/v1alpha1
kind: Plugin
metadata:
  name: billing
spec:
  shortDescription: View metered usage and spend for your organization or project
  homepage: https://github.com/milo-os/billing
  version: v0.10.0
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/milo-os/billing/releases/download/v0.10.0/milo-billing_Linux_x86_64.tar.gz
      sha256: 5da8b3388ea18dccb4a39a86cfc2a16542b992c6a39c2ffaf6d6ea640803ab91
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/milo-os/billing/releases/download/v0.10.0/milo-billing_Linux_arm64.tar.gz
      sha256: e9410138d22da3505d56a3cf224abc58559a9fa2bf7de2c4d53043e803a4a3ee
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/milo-os/billing/releases/download/v0.10.0/milo-billing_Darwin_x86_64.tar.gz
      sha256: 421ea027eb65198f66bcf9ffddd1635a07195b60578cd8afb72c297e8a18f805
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/milo-os/billing/releases/download/v0.10.0/milo-billing_Darwin_arm64.tar.gz
      sha256: 7b4f831949d917c892de3cae632eee7a92951b9fcb18f563c20fd6911712f9f5
    - selector:
        matchLabels:
          os: windows
          arch: amd64
