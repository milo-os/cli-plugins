name: Regenerate index.yaml

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugins/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate index.yaml from plugins/
        run: |
          python3 - <<'EOF'
          import os, yaml

          # Catalog identity header, surfaced in `datumctl plugin index list`
          # and `datumctl plugin browse`. Followed by the plugin list.
          index = {
              "apiVersion": "datumctl.datum.net/v1alpha1",
              "kind": "PluginList",
              "name": "milo-os",
              "description": "Portable CLI plugins for the Milo platform",
              "owner": "milo-os",
              "homepage": "https://github.com/milo-os/cli-plugins",
              "items": [],
          }

          for filename in sorted(os.listdir("plugins")):
              if not filename.endswith(".yaml"):
                  continue
              with open(f"plugins/{filename}") as fh:
                  plugin = yaml.safe_load(fh)
              index["items"].append(plugin)

          with open("index.yaml", "w") as fh:
              yaml.dump(index, fh, default_flow_style=False, allow_unicode=True, sort_keys=False)

          print(f"Generated index.yaml with {len(index['items'])} plugin(s)")
          EOF

      - name: Open PR with updated index.yaml
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: regenerate index.yaml"
          branch: chore/regen-index
          title: "chore: regenerate index.yaml"
          body: |
            The plugin catalog index has been automatically regenerated following a change to one or more plugin manifests.

            The index is what `datumctl` reads to discover available plugins, their current versions, and where to download them for each platform. Keeping it in sync ensures users always see accurate information when installing or updating plugins.
