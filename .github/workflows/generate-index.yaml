name: Regenerate index.yaml

# index.yaml is what datumctl reads, and it is fully derived from plugins/*.yaml.
# When plugins/ changes on main, regenerate the index and open (or refresh) a
# pull request with the result, set to merge itself once required checks pass.
#
# main requires the "ci / Build and test" check, so the index can only reach it
# through a pull request that CI has run on. Pull requests opened with
# GITHUB_TOKEN do not trigger workflows, so the pull request is opened with the
# catalog's GitHub App token instead. The pull request touches only index.yaml,
# not plugins/**, so merging it never retriggers this workflow.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
  workflow_dispatch:

# Serialize so two quick merges can't race on the regenerate-index branch.
concurrency:
  group: regenerate-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install tooling
        run: pip install --quiet "PyYAML==6.0.3"

      - name: Regenerate index.yaml
        run: python3 scripts/generate_index.py

      - name: Mint catalog token from a GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PLUGIN_INDEX_APP_ID }}
          private-key: ${{ secrets.PLUGIN_INDEX_APP_PRIVATE_KEY }}

      # When index.yaml is already in sync, this closes any open regenerate
      # pull request and deletes its branch.
      - name: Open or update the regenerate pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: regenerate-index
          delete-branch: true
          sign-commits: true
          add-paths: index.yaml
          commit-message: "chore: Regenerate index.yaml"
          title: "chore: Regenerate index.yaml"
          body: |
            Brings `index.yaml` back in line with `plugins/*.yaml` as of ${{ github.sha }}.

            The Regenerate index.yaml workflow opened this pull request, and it merges itself once required checks pass.

      - name: Merge the pull request once checks pass
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --merge
